name: ko-import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy upstream tree and push
        run: |
          set -e
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          curl -sL https://github.com/TanmoyP/klarbase/archive/refs/heads/main.tar.gz -o /tmp/up.tgz
          mkdir -p /tmp/up
          tar xzf /tmp/up.tgz -C /tmp/up --strip-components=1
          rsync -a --exclude .git --exclude .github --exclude README.md /tmp/up/ ./
          rm -f docs/size-test.txt
          git add -A
          git commit -m "원작 TanmoyP/klarbase 소스(MIT) 가져옴 — 한글화 기반"
          git push origin HEAD:main
          echo OK
