name: ko-import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mine
          fetch-depth: 1
      - name: Clone upstream with history and push as main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "sigco3111"
          git config --global user.email "sigco3111k@gmail.com"
          cd /tmp
          git clone --quiet https://github.com/TanmoyP/klarbase.git up
          cd up
          git remote add mine "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rsync -a --exclude .git --exclude README.md "${GITHUB_WORKSPACE}/mine/" ./
          git add -A
          git commit -m "한국어판: 원작 전체 이력 위에 한글화 기반 파일 추가"
          git push --force mine HEAD:main
          echo done
