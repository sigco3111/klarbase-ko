name: ko-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ko-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: 하위 경로 확인 (루트 절대경로 0건)
        run: |
          cd client/dist
          cp index.html 404.html
          echo "--- root-absolute refs (expect 0) ---"
          grep -oE '(src|href)="/[^/]' index.html | sort | uniq -c || true
          test $(grep -cE '(src|href)="/[^/]' index.html || true) -eq 0
          ls
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
