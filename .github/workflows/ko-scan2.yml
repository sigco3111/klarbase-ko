name: ko-scan2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan strings
        run: node tools/ko-scan2.mjs
      - name: commit report
        run: |
          git config user.name sigco3111
          git config user.email sigco3111k@gmail.com
          git add tools/ko-todo.txt tools/ko-todo-count.txt
          git commit -m "chore: 영문 문자열 2차 스캔 결과" || echo none
          git push origin HEAD:main
